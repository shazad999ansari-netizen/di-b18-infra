name: Terraform Plan

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: self-hosted

    steps:

      # Checkout Code
      - name: Checkout
        uses: actions/checkout@v4

      # Azure Login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform Setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Terraform Init
      - name: Terraform Init
        working-directory: environments/preprod
        shell: powershell
        run: terraform init -input=false

      # Terraform Validate
      - name: Terraform Validate
        working-directory: environments/preprod
        shell: powershell
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: environments/preprod
        shell: powershell
        run: terraform plan -input=false -var-file="terraform.tfvars"